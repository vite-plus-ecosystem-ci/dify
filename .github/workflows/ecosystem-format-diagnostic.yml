# Temporary ecosystem smoke diagnostic. Remove after comparing the Linux formatter output.
name: Ecosystem formatter diagnostic
on:
  pull_request:
    paths:
      - .github/workflows/ecosystem-format-diagnostic.yml
permissions:
  contents: read
jobs:
  formatter:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-web
      - name: Capture formatter changes
        run: |
          vp fmt
          git diff --binary > formatter.patch
          git diff --stat
      - uses: actions/upload-artifact@v4
        with:
          name: linux-formatter-patch
          path: formatter.patch
